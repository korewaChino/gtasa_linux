name: Build PortMaster artifact

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      GAME: "${{ github.ref_name == 'miami' && 'gtavc' || 'gtasa' }}"
      LAUNCHER_SCRIPT: "${{ github.ref_name == 'miami' && 'Grand Theft Auto Vice City.sh' || 'Grand Theft Auto San Andreas.sh' }}"
      BINARY_NAME: "${{ github.ref_name == 'miami' && 'gtavc_linux' || 'gtasa_linux' }}"
      GAME_TITLE: "${{ github.ref_name == 'miami' && 'Grand Theft Auto: Vice City' || 'Grand Theft Auto: San Andreas' }}"
      CONFIG_NAME: "${{ github.ref_name == 'miami' && 'gtavc.cfg' || 'gtasa_nx.cfg' }}"
      APPSTATE_NAME: "${{ github.ref_name == 'miami' && 'gtavc-appstate.txt' || 'appstate.txt' }}"
      IMAGE: ghcr.io/${{ github.repository_owner }}/gtasa-portmaster

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push flat PortMaster OCI artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: artifact
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.GAME }}
          build-args: |
            GAME=${{ env.GAME }}
            LAUNCHER_SCRIPT=${{ env.LAUNCHER_SCRIPT }}
            BINARY_NAME=${{ env.BINARY_NAME }}
            GAME_TITLE=${{ env.GAME_TITLE }}
            CONFIG_NAME=${{ env.CONFIG_NAME }}
            APPSTATE_NAME=${{ env.APPSTATE_NAME }}
          cache-from: type=gha,scope=${{ env.GAME }}
          cache-to: type=gha,mode=max,scope=${{ env.GAME }}
